<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RR Piloto · Rubus Racing</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#d4232a">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RR Piloto">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{--bg:#f6f6f4;--card:#fff;--tx:#1b1b1b;--mu:#6b6b66;--bd:#dcdcd6;--ac:#d4232a;--ac2:#fff;--ok:#1f8a4c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--card:#1d1d1d;--tx:#eee;--mu:#9a9a94;--bd:#333;--ac:#ef4a50;--ac2:#111;--ok:#4cc27f}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:14px 16px 0;max-width:780px;margin:0 auto}
h1{font-size:20px;margin:0}h1 span{color:var(--ac)}
.sub{color:var(--mu);font-size:13px;margin:2px 0 10px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:2px;background:var(--card);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 2px;border:0;background:none;color:var(--mu);font:inherit;font-size:11px;cursor:pointer;border-radius:8px}
nav button b{font-size:20px;line-height:1.1}
nav button.on{color:var(--ac);font-weight:700;background:var(--bg)}
main{max-width:780px;margin:0 auto;padding:12px 16px 20px}
fieldset{border:1px solid var(--bd);background:var(--card);border-radius:10px;margin:0 0 18px;padding:14px 14px 8px;min-width:0}
legend{font-weight:700;padding:0 6px;color:var(--ac)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:4px 14px}
.g>*{min-width:0}
label{display:block;font-size:13px;color:var(--mu);margin:0 0 16px}
input,select,textarea{display:block;width:100%;margin-top:6px;padding:12px;min-width:0;border:1px solid var(--bd);border-radius:7px;background:var(--bg);color:var(--tx);font:inherit}
input,select,textarea{font-size:16px}
input[type=date]{max-width:100%;-webkit-appearance:none;appearance:none;height:46px;text-align:left}
textarea{min-height:84px;resize:vertical}
.full{grid-column:1/-1}
.btn{padding:10px 16px;border:0;border-radius:8px;background:var(--ac);color:var(--ac2);font:inherit;font-weight:600;cursor:pointer}
.btn.s{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.btn.add{background:var(--ok);color:var(--ac2)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.ok{color:var(--ok);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:14px}
.st{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px}
.st b{display:block;font-size:18px}.st small{color:var(--mu)}
.t{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:10px}
.t h3{margin:0 0 4px;font-size:15px}
.tag{font-size:11px;padding:2px 8px;border-radius:20px;border:1px solid var(--bd);color:var(--mu);margin-left:6px}
.tag.c{border-color:var(--ac);color:var(--ac)}
.best{color:var(--ok);font-weight:700}
.mu{color:var(--mu);font-size:13px}
.imp{border-left:3px solid var(--ac);padding-left:8px;margin:6px 0 0}
#ent{counter-reset:e}
.en{border:2px solid var(--ac);border-radius:10px;padding:8px 10px 0;margin-bottom:14px}
.en summary{cursor:pointer;font-weight:700;margin-bottom:8px}
.en summary::before{counter-increment:e;content:"Entrada a pista " counter(e)}
.en fieldset{border-style:dashed}
#sh,.ovl{position:fixed;inset:0;background:rgba(0,0,0,.82);overflow:auto;z-index:50;padding:calc(12px + env(safe-area-inset-top,0px)) 12px 24px}
.shc{max-width:520px;margin:0 auto;background:var(--card);border-radius:12px;padding:12px}
#cv,#out{width:100%;height:auto;border-radius:8px;display:block;margin-bottom:10px}
.cs{background:var(--bg);border-radius:8px;padding:10px;margin-bottom:10px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mu);font-weight:600}
tr.sel td{background:var(--bg);font-weight:600}
tbody tr{cursor:pointer}
.bar{height:10px;border-radius:5px;background:var(--ac);margin:2px 0 8px}
.ax{fill:var(--mu);font-size:11px}.gl{stroke:var(--bd)}.ln{fill:none;stroke:var(--ac);stroke-width:2.5}.pt{fill:var(--ac)}.pb{fill:var(--ok)}
footer{max-width:780px;margin:0 auto;padding:0 16px 96px;text-align:center;color:var(--mu);font-size:12px}
.ck{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--tx);margin:0 0 12px}
.ck input{width:auto;margin-top:3px}
.tc{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:4px 14px;margin-bottom:14px;font-size:14px}
.tc ul{padding-left:20px}
.hero{display:flex;gap:14px;align-items:center;margin:6px 0 14px}
.av{border-radius:50%;object-fit:cover;border:3px solid var(--ac);flex:none}
.bd{display:inline-block;padding:6px 10px;border:1px solid var(--bd);border-radius:20px;margin:0 6px 8px 0;font-size:13px;opacity:.45}
.bd.on{opacity:1;border-color:var(--ok);color:var(--ok);font-weight:600}
svg{width:100%;height:auto;display:block}
svg.ic{display:inline-block;width:auto;flex:none;vertical-align:-3px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px}
nav button b{display:flex;justify-content:center;height:24px}
.bd{display:inline-flex;align-items:center;gap:6px}
.ttl{display:flex;align-items:center;gap:8px}
.dsel{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.dsel button{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:20px;padding:6px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.dsel button.on{background:var(--ac);border-color:var(--ac);color:var(--ac2)}
.chk{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.chk label{display:inline-flex;align-items:center;gap:8px;margin:0;padding:8px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:14px;cursor:pointer}
.chk input{width:auto;margin:0}
.ad{position:relative;display:block;background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden;margin:0 0 14px;color:var(--tx);cursor:pointer}
.ad img{display:block;width:100%;aspect-ratio:3/1;object-fit:cover;background:var(--bg)}
.ad .adt{padding:10px 12px}.ad .adt b{display:block;font-size:15px}
.ad .adl{position:absolute;top:8px;left:8px;font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;background:rgba(0,0,0,.6);color:#fff;padding:2px 7px;border-radius:6px}
.ad .adt .adl{position:static;display:inline-block;margin-bottom:4px;background:var(--bg);color:var(--mu)}
fieldset.lk{background:repeating-linear-gradient(-45deg,var(--card),var(--card) 12px,var(--bg) 12px,var(--bg) 24px)}
fieldset.lk>*:not(legend){opacity:.45;pointer-events:none}
.lkn{font-size:12px;font-weight:600;color:var(--mu)}
.lnk{border:0;background:none;color:var(--ac);font:inherit;font-weight:700;text-decoration:underline;cursor:pointer;padding:0}
.pl{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:8px}
.pc{display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;background:var(--card);border:2px solid var(--bd);border-radius:12px;padding:14px;cursor:pointer;text-align:left;font:inherit;color:var(--tx)}
.pc.on{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac) inset}
.pc h3{margin:0;font-size:17px}.pc .pr{font-size:22px;font-weight:800;margin:2px 0 4px;color:var(--ac)}
.pc ul{padding-left:18px;margin:6px 0 0;font-size:13px}
.auth{max-width:440px;margin:0 auto}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 10px;border-radius:20px;background:var(--ac);color:var(--ac2);margin-left:6px;cursor:pointer;border:0;font-family:inherit}
#toast{display:none;position:fixed;left:50%;bottom:86px;transform:translateX(-50%);z-index:60;max-width:calc(100% - 32px);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;box-shadow:0 4px 18px rgba(0,0,0,.25)}
.mt{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:10px}
.naw{min-width:0}.naw>label:first-child{margin-bottom:6px}
label.na{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--mu);cursor:pointer;margin:0 0 16px}
label.na input{width:auto;margin:0}
input[readonly],textarea[readonly]{opacity:.6}
#crc{display:block;width:100%;max-width:420px;height:auto;margin:0 auto;border-radius:8px;background:#000;touch-action:none;cursor:grab}
.ovl{z-index:70}
.ph{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:0 0 14px}
.ph img{width:220px;max-width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;border:1px solid var(--bd);background:var(--card)}
.ph .row{margin:0}
.mt h3{margin:0 0 4px;font-size:16px}
.chd{display:flex;gap:14px;align-items:center}
.cl{display:flex;flex-direction:column;gap:8px;margin:0 0 14px}
.crow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;font:inherit;color:var(--tx);cursor:pointer}
.crow:hover{border-color:var(--ac)}
.crow .ci{width:40px;height:40px;border-radius:10px;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--ac);flex:none}
.crow .ct{flex:1;min-width:0}.crow .ct b{display:block}.crow .ct small{display:block;color:var(--mu);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow>svg:last-child{color:var(--mu)}
details.acc{background:var(--card);border:1px solid var(--bd);border-radius:10px;margin:0 0 10px}
details.acc summary{display:flex;justify-content:space-between;align-items:center;padding:13px 14px;cursor:pointer;font-weight:700;color:var(--ac);list-style:none}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary small{font-weight:600;color:var(--mu)}
details.acc[open] summary{border-bottom:1px solid var(--bd);margin-bottom:12px}
details.acc .g{padding:0 14px 4px}
.stk{position:sticky;bottom:70px;background:var(--bg);padding:8px 0;margin:0;z-index:5}
.cth{float:right;width:84px;height:60px;object-fit:cover;border-radius:8px;margin:0 0 6px 10px;border:1px solid var(--bd)}
.cpv{margin:10px 0 0}.cpv>img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;border:1px solid var(--bd)}
.cpv .row{margin:6px 0 0;gap:6px}.cpv .row img{width:64px;height:44px;object-fit:cover;border-radius:6px;cursor:pointer;opacity:.7;border:2px solid transparent}.cpv .row img.on{opacity:1;border-color:var(--ac)}
.mds{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.md{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:12px 8px;text-align:center}
.md b{display:block;font-size:14px;margin-top:4px}.md small{display:block;color:var(--mu);font-size:12px}
.md.no{opacity:.5}.md.no svg{color:var(--bd)!important}
.lv{background:linear-gradient(135deg,var(--ac),#5a0d12);color:#fff;border-radius:14px;padding:16px;margin:0 0 14px}
.lv b{font-size:24px;display:block}.lv .bar{background:#fff;opacity:.9;margin:8px 0 4px}.lv .bw{background:rgba(255,255,255,.25);border-radius:5px}
.rw{display:flex;gap:12px;align-items:flex-start}.rw.no{opacity:.55}
.mg{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:12px}.mg .mt{margin:0}
.vw{position:relative;aspect-ratio:16/9;margin:10px 0 4px;border-radius:8px;overflow:hidden;background:#000}
.vw iframe,.vw video{position:absolute;inset:0;width:100%;height:100%;border:0}
.cod{display:inline-block;margin:8px 0 0;font:800 17px/1.3 ui-monospace,Menlo,monospace;padding:8px 12px;border:2px dashed var(--ac);border-radius:8px;white-space:pre-wrap;word-break:break-word}.mt p{margin:6px 0;white-space:pre-wrap}
</style>
</head>
<body>
<header>
  <div style="display:flex;align-items:center;gap:10px;cursor:pointer;width:max-content" role="link" tabindex="0" aria-label="Ir al inicio" onclick="if(ME&&ME.estado==='APROBADO')go('inicio')"><img id="lg" alt="RR Piloto" style="height:46px;width:46px;border-radius:8px"><h1>RR <span>Piloto</span></h1></div>
  <div class="sub" id="sub">Rubus Racing · Beta</div>
  <div class="dsel" id="dsel" aria-label="Deporte"></div>
  <nav id="nav"></nav>
</header>
<main id="v"></main>
<div id="toast" role="status"></div>
<footer>Desarrollado por Rubus Racing. Todos los derechos reservados.</footer>
<script src="iconos.js"></script>
<script src="campos.js"></script>
<script>
var KEY="rrficha1";
function mig(d){d=d||{};var r={perfil:d.perfil||{},motos:d.motos||[],sesiones:d.sesiones||[]};
 if(!d.motos&&d.moto&&Object.keys(d.moto).length){d.moto.id="m"+Date.now();r.motos=[d.moto]}
 if(!d.sesiones&&d.tandas)r.sesiones=d.tandas.map(function(t){return{id:t.id,fecha:t.fecha,circuito:t.circuito,tipo:t.tipo,clima:t.clima,posicion:t.pos,ajustes:t.config,mejorar:t.mejorar,sensaciones:t.notas,entradas:[{minutos:t.minutos,vueltas:t.vueltas,mejor:t.mejor}]}});
 r.sesiones.forEach(function(s){(s.entradas||[]).forEach(function(e){["clima","posicion","trazado","sentido","obsPista","motoId","pinon","corona","neum","combustible","ajustes","sensaciones","nivel","mejorado","mejorar"].forEach(function(k){if(e[k]==null&&s[k]!=null)e[k]=s[k]})})});r.sesiones.forEach(function(s){if(!s.deporte)s.deporte="moto"});r.motos.forEach(function(m){if(!m.deporte)m.deporte="moto"});
 r.pistas=d.pistas||{};r.consent=d.consent||null;r.foto=d.foto||"";return r}
var db=mig({}),ME=null,VER=0,LOCAL=null,MAT=null,ACT="moto";
/* DEPORTES: el piloto elige los suyos; la app muestra uno a la vez */
function misDep(){return ME&&ME.deportes&&ME.deportes.length?ME.deportes:["moto"]}
function setAct(d){ACT=misDep().indexOf(d)>=0?d:misDep()[0];try{localStorage.setItem("rrdep",ACT)}catch(e){}}
function initAct(){var d="";try{d=localStorage.getItem("rrdep")||""}catch(e){}setAct(d||misDep()[0])}
function vt(){return dep(ACT)[2]}
function V(){return VEH[vt()]}
// Sesiones del deporte activo, y vehículos del mismo tipo (moto, kart o auto).
function SS(){return db.sesiones.filter(function(s){return s.deporte===ACT})}
function MV(){return db.motos.filter(function(m){return dep(m.deporte)[2]===vt()})}
function cambiarDep(d){setAct(d);editing=null;dc=null;curMoto=null;nav();render();if(!CIR[ACT])cargarCir(function(){})}
var $=function(s){return document.querySelector(s)};

/* SERVIDOR: la ficha vive en la base de datos de Rubus Racing */
function api(m,u,b){if(b===undefined&&m!=="GET")b={};
 return fetch(u,{method:m,credentials:"same-origin",headers:b!==undefined?{"Content-Type":"application/json"}:{},body:b!==undefined?JSON.stringify(b):undefined})
 .then(function(r){return r.json().catch(function(){return{}}).then(function(j){if(!r.ok){var e=new Error(j.error||"No se pudo conectar con el servidor.");e.status=r.status;throw e}return j})},function(){var e=new Error("Sin conexión. Revisa tu internet.");e.status=0;throw e})}
function toast(m){var t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(function(){t.style.display="none"},4000)}
function doc(){return{perfil:db.perfil,motos:db.motos,sesiones:db.sesiones,pistas:db.pistas,foto:db.foto}}
// Los cambios se agrupan y se envían en una sola petición; si llega otro
// mientras se guarda, se manda después con la versión nueva.
function save(){if(RWD)RWD.viejo=1;clearTimeout(save.t);save.t=setTimeout(push,400)}
function push(){save.t=null;if(push.busy){push.again=1;return}push.busy=1;
 api("PUT","/api/ficha",{datos:doc(),version:VER}).then(function(r){VER=r.version})
 .catch(function(e){toast(e.message);if(e.status===409||e.status===403)return reload()})
 .then(function(){push.busy=0;if(push.again){push.again=0;push()}})}
function reload(){return api("GET","/api/ficha").then(function(r){db=mig(r.datos);VER=r.version;if(ME&&ME.estado==="APROBADO")render()})}
window.addEventListener("pagehide",function(){if(!save.t)return;clearTimeout(save.t);try{fetch("/api/ficha",{method:"PUT",keepalive:true,credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({datos:doc(),version:VER})})}catch(e){}});
// Datos que el prototipo dejó en este navegador, para ofrecer subirlos.
function localData(){try{var d=JSON.parse(localStorage.getItem(KEY)||"null");if(!d)return null;d=mig(d);return d.sesiones.length||d.motos.length||Object.keys(d.perfil).length?d:null}catch(e){return null}}

/* PLANES (simulados durante la beta) */
var PLANES=[["GRATIS","Gratis","$0",["Perfil y ficha de emergencia","Registro de tiempos en una pista","Imágenes para compartir con marca de agua","Incluye anuncios de sponsors"]],
 ["PLUS","Plus","$1 al mes",["Todo lo del plan Gratis","Pistas ilimitadas","Vehículos: piñón, catalina, neumáticos y ajustes","Trazado, sensaciones y rendimiento","Estadísticas e imágenes para compartir sin marca de agua","Incluye anuncios de sponsors"]],
 ["PRO","Pro","$5 al mes",["Todo lo del plan Plus","Descuentos en marcas","Material educativo y de capacitación","Sin anuncios (puedes activarlos para apoyar la app)"]]];
var NV={GRATIS:0,PLUS:1,PRO:2};
function niv(){return ME?NV[ME.planEfectivo]||0:0}
function pName(id){var p=PLANES.filter(function(x){return x[0]===id})[0];return p?p[1]:id}
function planCards(sel,fn){return '<div class="pl">'+PLANES.map(function(p){return '<button type="button" class="pc'+(p[0]===sel?" on":"")+'" onclick="'+fn+'(\''+p[0]+'\')"><h3>'+p[1]+'</h3><div class="pr">'+p[2]+'</div><ul>'+p[3].map(function(x){return '<li>'+x+'</li>'}).join("")+'</ul></button>'}).join("")+'</div><p class="mu">Beta: los planes de pago son simulados. No se cobra nada.</p>'}
// Bloque que exige un plan: si no alcanza, se muestra gris y sin edición.
function L(n,title,inner){var ok=niv()>=n;return '<fieldset'+(ok?'':' disabled class="lk"')+'><legend>'+title+(ok?'':' <span class="lkn">'+ic("candado",13)+' Plan '+(n===2?"Pro":"Plus")+' · <button type="button" class="lnk" onclick="go(\'plan\')">Ver planes</button></span>')+'</legend>'+inner+'</fieldset>'}
function lockCard(n,t,d){return '<div class="t"><h3 class="ttl">'+ic("candado",20)+t+'</h3><p class="mu" style="margin:4px 0 10px">'+d+' Disponible desde el plan '+(n===2?"Pro ($5 al mes)":"Plus ($1 al mes)")+'.</p><button class="btn" onclick="go(\'plan\')">Ver planes</button></div>'}
/* APP INSTALABLE Y NOTIFICACIONES */
var INST=null;
function standalone(){return matchMedia("(display-mode: standalone)").matches||navigator.standalone===true}
function iOS(){return /iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1)}
if("serviceWorker" in navigator)window.addEventListener("load",function(){navigator.serviceWorker.register("/sw.js").catch(function(){})});
window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();INST=e;if(ME&&(cur==="inicio"||cur==="cuenta"))render()});
window.addEventListener("appinstalled",function(){INST=null;toast("RR Piloto quedó instalada ✓");if(ME)render()});
function instalar(){if(INST){INST.prompt();INST.userChoice.then(function(){INST=null;render()});return}

 var n=RWD.progreso.nivel,I=RWD.items;
 h+='<fieldset><legend class="ttl">'+ic("regalo",16)+'Premios por nivel</legend><p class="mu" style="margin:0 0 10px">Puntos: 1 por minuto en pista y '+PREMIOS.puntosRecord+' por cada récord personal. Al subir de nivel desbloqueas los premios de Rubus Racing y sus sponsors.</p>'
 +(I.length?PREMIOS.niveles.map(function(x,i){var R=I.filter(function(r){return r.nivel===i+1});if(!R.length)return "";var ok=n>=i+1;
  return '<h4 class="ttl" style="margin:14px 0 8px">'+(ok?ic("ok",16):ic("candado",16))+'Nivel '+(i+1)+' · '+esc(x[1])+(ok?"":' <span class="mu" style="font-weight:400">('+x[0]+' pts)</span>')+'</h4>'+R.map(function(r){return '<div class="t rw'+(r.desbloqueada?"":" no")+'"><span style="color:var(--ac)">'+ic(r.desbloqueada?"regalo":"candado",30)+'</span><div style="min-width:0;flex:1"><b>'+esc(r.titulo)+'</b>'+(r.sponsor?'<div class="mu">'+esc(r.sponsor)+'</div>':"")+(r.descripcion?'<div style="margin-top:4px;white-space:pre-wrap">'+esc(r.descripcion)+'</div>':"")
   +(r.desbloqueada?(r.codigo?'<div class="cod" id="rw'+r.id+'">'+esc(r.codigo)+'</div> <button class="btn s" onclick="cpTxt(\'rw'+r.id+'\')">'+ic("copiar")+'Copiar</button>':"")+(/^https?:\/\//.test(r.enlace||"")?' <a class="btn s" style="text-decoration:none;margin-top:8px" href="'+esc(r.enlace)+'" target="_blank" rel="noopener">Usar premio'+ic("enlace",15)+'</a>':""):'<div class="mu" style="margin-top:6px">Se desbloquea en el nivel '+r.nivel+'.</div>')+'</div></div>'}).join("")}).join(""):'<p class="mu">Pronto habrá premios para desbloquear.</p>')+'</fieldset>';
 $("#v").innerHTML=h}

/* PUBLICIDAD: Gratis y Plus ven anuncios de sponsors; Pro solo si los activa */
function verAds(){return ME&&(ME.planEfectivo!=="PRO"||ME.anunciosPro)}
function adSlot(l){return verAds()?'<div class="adslot" data-lugar="'+l+'"></div>':""}
// El anuncio de cada espacio se guarda 5 minutos: cambiar de pestaña no vuelve
// a pedirlo al servidor ni hace saltar el contenido cuando llega.
var ADC={};
function fillAds(){document.querySelectorAll(".adslot:not([data-ok])").forEach(function(el){el.dataset.ok=1;var k=el.dataset.lugar+"|"+ACT,c=ADC[k];
 if(c&&Date.now()-c.t<300000){el.innerHTML=c.h;return}
 api("GET","/api/anuncios?lugar="+el.dataset.lugar+"&deporte="+ACT).then(function(r){var a=r.anuncio,h=a?adHtml(a):"";ADC[k]={h:h,t:Date.now()};if(el.isConnected)el.innerHTML=h}).catch(function(){})})}
function adHtml(a){return '<div class="ad" role="link" tabindex="0" data-id="'+esc(a.id)+'" data-href="'+esc(/^https?:\/\//.test(a.enlace||"")?a.enlace:"")+'" onclick="adClic(this)">'+(a.imagen?'<img src="'+esc(a.imagen)+'" alt=""><span class="adl">Publicidad</span>':"")+'<div class="adt">'+(a.imagen?"":'<span class="adl">Publicidad</span>')+'<b>'+esc(a.titulo)+'</b>'+(a.texto?'<div class="mu">'+esc(a.texto)+'</div>':"")+'<div class="mu" style="margin-top:4px">'+esc(a.sponsor)+'</div></div></div>'}
function adClic(el){var u=el.dataset.href;try{fetch("/api/anuncios/"+encodeURIComponent(el.dataset.id)+"/clic",{method:"POST",keepalive:true,credentials:"same-origin",headers:{"Content-Type":"application/json"},body:"{}"})}catch(e){}if(u)window.open(u,"_blank","noopener")}
function adsBox(){var pro=ME.planEfectivo==="PRO";return '<fieldset><legend>Anuncios de sponsors</legend>'+(pro?'<label class="ck"><input type="checkbox"'+(ME.anunciosPro?" checked":"")+' onchange="setAds(this)"><span>Mostrar anuncios de nuestros sponsors. Ayudan a mantener RR Piloto.</span></label>':'<p class="mu" style="margin:0">Tu plan incluye anuncios de nuestros sponsors, que ayudan a mantener RR Piloto. El plan Pro no tiene anuncios.</p>')+'</fieldset>'}
function setAds(c){api("PUT","/api/cuenta/anuncios",{activo:c.checked}).then(function(r){ME=r.user;toast(c.checked?"¡Gracias por apoyar a RR Piloto!":"Anuncios desactivados")}).catch(function(e){c.checked=!c.checked;toast(e.message)})}

/* PLANES */
function planView(){$("#v").innerHTML='<div class="row" style="margin:4px 0 8px"><button class="btn s" onclick="go(\'cuenta\')">← Cuenta</button></div><h2 style="margin:4px 0 6px;font-size:20px">Tu plan</h2><p class="mu" style="margin:0 0 12px">'+planTxt()+'. Puedes cambiarlo cuando quieras.</p>'+planCards(ME.plan,"setPlan")}
function setPlan(p){if(p===ME.plan)return;api("PUT","/api/cuenta/plan",{plan:p}).then(function(r){ME=r.user;MAT=null;toast("Plan "+pName(p)+" activado ✓");render()}).catch(function(e){toast(e.message)})}

/* MATERIAL (provisorio: más adelante será una plataforma propia) */
var MTAB="MATERIAL",MCAT="";
// Videos de YouTube, Vimeo o archivos de video se muestran embebidos. Solo se
// toma el identificador del video, nunca la URL tal cual, para el iframe.
function vid(u){u=String(u||"");var m=u.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([\w-]{6,20})/i),A=' loading="lazy" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"';
 if(m)return '<div class="vw"><iframe src="https://www.youtube-nocookie.com/embed/'+m[1]+'?rel=0" title="Video"'+A+'></iframe></div>';
 m=u.match(/vimeo\.com\/(?:video\/)?(\d{5,12})/i);if(m)return '<div class="vw"><iframe src="https://player.vimeo.com/video/'+m[1]+'" title="Video"'+A+'></iframe></div>';
 if(/^https?:\/\/[^\s"]+\.(mp4|webm|mov)(\?[^\s"]*)?$/i.test(u))return '<div class="vw"><video src="'+esc(u)+'" controls preload="metadata" playsinline></video></div>';return ""}
function mCard(x){var v=vid(x.enlace),pdf=/\.pdf(\?|$)/i.test(x.enlace||""),lk=!v&&/^https?:\/\//.test(x.enlace||""),c=x.cuerpo||"";
 var body=!c?"":x.tipo==="BENEFICIO"?'<div class="cod" id="c'+x.id+'">'+esc(c)+'</div> <button class="btn s" onclick="cpTxt(\'c'+x.id+'\')">'+ic("copiar")+'Copiar</button>':c.length>240?'<details><summary class="lnk">Leer más</summary><p>'+esc(c)+'</p></details>':'<p>'+esc(c)+'</p>';
 return '<div class="mt">'+(x.categoria?'<span class="tag c" style="margin:0 0 6px;display:inline-block">'+esc(x.categoria)+'</span>':"")+'<h3 class="ttl">'+(v?ic("play"):pdf?ic("archivo"):x.tipo==="BENEFICIO"?ic("etiqueta"):"")+esc(x.titulo)+'</h3>'+(x.resumen?'<div class="mu">'+esc(x.resumen)+'</div>':"")+v+body
 +(lk?'<div style="margin-top:8px"><a class="btn s" style="display:inline-block;text-decoration:none" href="'+esc(x.enlace)+'" target="_blank" rel="noopener">'+(pdf?"Abrir PDF":x.tipo==="BENEFICIO"?"Ir a la tienda":"Abrir enlace")+ic("enlace",15)+'</a></div>':"")+'</div>'}
function cpTxt(id){var t=$("#"+id).textContent;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){toast("Copiado ✓")},function(){toast(t)})}
function mat(){if(niv()<2){$("#v").innerHTML=lockCard(2,"Material y beneficios","Accede a material educativo y de capacitación teórica de Rubus Racing, y a descuentos en marcas asociadas.");return}
 if(!MAT){$("#v").innerHTML='<p class="mu">Cargando material…</p>';api("GET","/api/contenido").then(function(r){MAT=r.items;if(cur==="mat")mat()}).catch(function(e){$("#v").innerHTML='<p class="mu">'+esc(e.message)+'</p>'});return}
 var T=MAT.filter(function(x){return x.tipo===MTAB}),cs=[];T.forEach(function(x){var k=x.categoria||"";if(cs.indexOf(k)<0)cs.push(k)});if(cs.indexOf(MCAT)<0)MCAT="";
 var n=function(t){return MAT.filter(function(x){return x.tipo===t}).length};
 var h='<h2 style="margin:4px 0 10px;font-size:20px">Material y beneficios</h2><div class="row"><button class="btn'+(MTAB==="MATERIAL"?"":" s")+'" onclick="MTAB=\'MATERIAL\';MCAT=\'\';mat()">'+ic("material")+'Material educativo ('+n("MATERIAL")+')</button><button class="btn'+(MTAB==="BENEFICIO"?"":" s")+'" onclick="MTAB=\'BENEFICIO\';MCAT=\'\';mat()">'+ic("etiqueta")+'Descuentos ('+n("BENEFICIO")+')</button></div>';
 if(cs.filter(Boolean).length)h+='<div class="row">'+[""].concat(cs.filter(Boolean)).map(function(k){return '<button class="pill" style="margin:0;'+(k===MCAT?"":"background:var(--card);color:var(--tx);border:1px solid var(--bd)")+'" onclick="MCAT=this.dataset.k;mat()" data-k="'+esc(k)+'">'+(k?esc(k):"Todas")+'</button>'}).join("")+'</div>';
 if(!T.length)h+='<p class="mu">Pronto agregaremos contenido aquí.</p>';
 else (MCAT?[MCAT]:cs).forEach(function(k){var I=T.filter(function(x){return (x.categoria||"")===k});if(!I.length)return;h+=(cs.length>1||k?'<h3 style="margin:16px 0 8px;font-size:16px">'+(k?esc(k):"Otros")+'</h3>':"")+'<div class="mg">'+I.map(mCard).join("")+'</div>'});
 h+='<p class="mu" style="margin-top:14px">Módulo en construcción: pronto tendremos una plataforma completa de formación.</p>';
 $("#v").innerHTML=h}
function hist(g){var R=[];g.s.forEach(function(s){(s.entradas||[]).forEach(function(e,i){R.push([s,e,i])})});return R.reverse().map(function(r){var s=r[0],e=r[1],m=toMs(e.mejor);return '<tr style="cursor:default"><td>'+esc(s.fecha)+'</td><td>'+esc(s.tipo)+'</td><td>'+esc(s.evento)+'</td><td>'+(r[2]+1)+'</td><td>'+esc(e.clima)+'</td><td>'+(e.minutos?esc(e.minutos)+" min":"—")+'</td><td class="'+(m&&m===g.b?"best":"")+'">'+(m?fmt(m):esc(e.mejor||"—"))+'</td></tr>'}).join("")}

$("#lg").src=LOGOU;boot();
</script>
