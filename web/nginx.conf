server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # El TLS y las cabeceras de host las resuelve el Nginx Proxy Manager que
    # está delante; aquí se sirven la app y el panel, y se enruta la API.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml;

    # La ficha viaja entera con la foto y las imágenes de pistas en Base64. El
    # tope debe superar el de express.json en la API.
    client_max_body_size 12m;

    location /api/ {
        proxy_pass http://rr-piloto-api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # El Proxy Manager ya añadió la IP del visitante; se conserva la cadena
        # para que el limitador de intentos vea la IP real.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        add_header Cache-Control "no-store" always;
    }

    # Ni la app ni el panel se cachean: cada despliegue llega de inmediato.
    location ~ ^/(index\.html|admin\.html|campos\.js|iconos\.js)$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # El service worker debe revisarse en cada visita para que las versiones
    # nuevas se instalen sin esperar.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    location = /admin {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files /admin.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }
}
