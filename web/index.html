<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RR Piloto · Rubus Racing</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#d4232a">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>
:root{--bg:#f6f6f4;--card:#fff;--tx:#1b1b1b;--mu:#6b6b66;--bd:#dcdcd6;--ac:#d4232a;--ac2:#fff;--ok:#1f8a4c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--card:#1d1d1d;--tx:#eee;--mu:#9a9a94;--bd:#333;--ac:#ef4a50;--ac2:#111;--ok:#4cc27f}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:14px 16px 0;max-width:780px;margin:0 auto}
h1{font-size:20px;margin:0}h1 span{color:var(--ac)}
.sub{color:var(--mu);font-size:13px;margin:2px 0 10px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:2px;background:var(--card);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 2px;border:0;background:none;color:var(--mu);font:inherit;font-size:11px;cursor:pointer;border-radius:8px}
nav button b{font-size:20px;line-height:1.1}
nav button.on{color:var(--ac);font-weight:700;background:var(--bg)}
main{max-width:780px;margin:0 auto;padding:12px 16px 20px}
fieldset{border:1px solid var(--bd);background:var(--card);border-radius:10px;margin:0 0 18px;padding:14px 14px 8px;min-width:0}
legend{font-weight:700;padding:0 6px;color:var(--ac)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:4px 14px}
.g>*{min-width:0}
label{display:block;font-size:13px;color:var(--mu);margin:0 0 16px}
input,select,textarea{display:block;width:100%;margin-top:6px;padding:12px;min-width:0;border:1px solid var(--bd);border-radius:7px;background:var(--bg);color:var(--tx);font:inherit}
input,select,textarea{font-size:16px}
input[type=date]{max-width:100%;-webkit-appearance:none;appearance:none;height:46px;text-align:left}
textarea{min-height:84px;resize:vertical}
.full{grid-column:1/-1}
.btn{padding:10px 16px;border:0;border-radius:8px;background:var(--ac);color:var(--ac2);font:inherit;font-weight:600;cursor:pointer}
.btn.s{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.btn.add{background:var(--ok);color:var(--ac2)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.ok{color:var(--ok);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:14px}
.st{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px}
.st b{display:block;font-size:18px}.st small{color:var(--mu)}
.t{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:10px}
.t h3{margin:0 0 4px;font-size:15px}
.tag{font-size:11px;padding:2px 8px;border-radius:20px;border:1px solid var(--bd);color:var(--mu);margin-left:6px}
.tag.c{border-color:var(--ac);color:var(--ac)}
.best{color:var(--ok);font-weight:700}
.mu{color:var(--mu);font-size:13px}
.imp{border-left:3px solid var(--ac);padding-left:8px;margin:6px 0 0}
#ent{counter-reset:e}
.en{border:2px solid var(--ac);border-radius:10px;padding:8px 10px 0;margin-bottom:14px}
.en summary{cursor:pointer;font-weight:700;margin-bottom:8px}
.en summary::before{counter-increment:e;content:"Entrada a pista " counter(e)}
.en fieldset{border-style:dashed}
#sh{position:fixed;inset:0;background:rgba(0,0,0,.82);overflow:auto;z-index:50;padding:calc(12px + env(safe-area-inset-top,0px)) 12px 24px}
.shc{max-width:520px;margin:0 auto;background:var(--card);border-radius:12px;padding:12px}
#cv,#out{width:100%;height:auto;border-radius:8px;display:block;margin-bottom:10px}
.cs{background:var(--bg);border-radius:8px;padding:10px;margin-bottom:10px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mu);font-weight:600}
tr.sel td{background:var(--bg);font-weight:600}
tbody tr{cursor:pointer}
.bar{height:10px;border-radius:5px;background:var(--ac);margin:2px 0 8px}
.ax{fill:var(--mu);font-size:11px}.gl{stroke:var(--bd)}.ln{fill:none;stroke:var(--ac);stroke-width:2.5}.pt{fill:var(--ac)}.pb{fill:var(--ok)}
footer{max-width:780px;margin:0 auto;padding:0 16px 96px;text-align:center;color:var(--mu);font-size:12px}
.ck{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--tx);margin:0 0 12px}
.ck input{width:auto;margin-top:3px}
.tc{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:4px 14px;margin-bottom:14px;font-size:14px}
.tc ul{padding-left:20px}
.hero{display:flex;gap:14px;align-items:center;margin:6px 0 14px}
.av{border-radius:50%;object-fit:cover;border:3px solid var(--ac);flex:none}
.bd{display:inline-block;padding:6px 10px;border:1px solid var(--bd);border-radius:20px;margin:0 6px 8px 0;font-size:13px;opacity:.45}
.bd.on{opacity:1;border-color:var(--ok);color:var(--ok);font-weight:600}
svg{width:100%;height:auto;display:block}
fieldset.lk{background:repeating-linear-gradient(-45deg,var(--card),var(--card) 12px,var(--bg) 12px,var(--bg) 24px)}
fieldset.lk>*:not(legend){opacity:.45;pointer-events:none}
.lkn{font-size:12px;font-weight:600;color:var(--mu)}
.lnk{border:0;background:none;color:var(--ac);font:inherit;font-weight:700;text-decoration:underline;cursor:pointer;padding:0}
.pl{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:8px}
.pc{display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;background:var(--card);border:2px solid var(--bd);border-radius:12px;padding:14px;cursor:pointer;text-align:left;font:inherit;color:var(--tx)}
.pc.on{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac) inset}
.pc h3{margin:0;font-size:17px}.pc .pr{font-size:22px;font-weight:800;margin:2px 0 4px;color:var(--ac)}
.pc ul{padding-left:18px;margin:6px 0 0;font-size:13px}
.auth{max-width:440px;margin:0 auto}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 10px;border-radius:20px;background:var(--ac);color:var(--ac2);margin-left:6px;cursor:pointer;border:0;font-family:inherit}
#toast{display:none;position:fixed;left:50%;bottom:86px;transform:translateX(-50%);z-index:60;max-width:calc(100% - 32px);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;box-shadow:0 4px 18px rgba(0,0,0,.25)}
.mt{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:10px}
.mt h3{margin:0 0 4px;font-size:16px}.mt p{margin:6px 0;white-space:pre-wrap}
</style>
</head>
<body>
<header>
  <div style="display:flex;align-items:center;gap:10px"><img id="lg" alt="RR Piloto" style="height:46px;width:46px;border-radius:8px"><h1>RR <span>Piloto</span></h1></div>
  <div class="sub" id="sub">Rubus Racing · Beta</div>
  <nav id="nav"></nav>
</header>
<main id="v"></main>
<div id="toast" role="status"></div>
<footer>Desarrollado por Rubus Racing. Todos los derechos reservados.</footer>
<script src="campos.js"></script>
<script>
var KEY="rrficha1";
function mig(d){d=d||{};var r={perfil:d.perfil||{},motos:d.motos||[],sesiones:d.sesiones||[]};
 if(!d.motos&&d.moto&&Object.keys(d.moto).length){d.moto.id="m"+Date.now();r.motos=[d.moto]}
 if(!d.sesiones&&d.tandas)r.sesiones=d.tandas.map(function(t){return{id:t.id,fecha:t.fecha,circuito:t.circuito,tipo:t.tipo,clima:t.clima,posicion:t.pos,ajustes:t.config,mejorar:t.mejorar,sensaciones:t.notas,entradas:[{minutos:t.minutos,vueltas:t.vueltas,mejor:t.mejor}]}});
 r.sesiones.forEach(function(s){(s.entradas||[]).forEach(function(e){["clima","posicion","trazado","sentido","obsPista","motoId","pinon","corona","neum","combustible","ajustes","sensaciones","nivel","mejorado","mejorar"].forEach(function(k){if(e[k]==null&&s[k]!=null)e[k]=s[k]})})});r.pistas=d.pistas||{};r.consent=d.consent||null;r.foto=d.foto||"";return r}
var db=mig({}),ME=null,VER=0,LOCAL=null,MAT=null;
var $=function(s){return document.querySelector(s)};

/* SERVIDOR: la ficha vive en la base de datos de Rubus Racing */
function api(m,u,b){if(b===undefined&&m!=="GET")b={};
 return fetch(u,{method:m,credentials:"same-origin",headers:b!==undefined?{"Content-Type":"application/json"}:{},body:b!==undefined?JSON.stringify(b):undefined})
 .then(function(r){return r.json().catch(function(){return{}}).then(function(j){if(!r.ok){var e=new Error(j.error||"No se pudo conectar con el servidor.");e.status=r.status;throw e}return j})},function(){var e=new Error("Sin conexión. Revisa tu internet.");e.status=0;throw e})}
function toast(m){var t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(function(){t.style.display="none"},4000)}
function doc(){return{perfil:db.perfil,motos:db.motos,sesiones:db.sesiones,pistas:db.pistas,foto:db.foto}}
// Los cambios se agrupan y se envían en una sola petición; si llega otro
// mientras se guarda, se manda después con la versión nueva.
function save(){clearTimeout(save.t);save.t=setTimeout(push,400)}
function push(){save.t=null;if(push.busy){push.again=1;return}push.busy=1;
 api("PUT","/api/ficha",{datos:doc(),version:VER}).then(function(r){VER=r.version})
 .catch(function(e){toast(e.message);if(e.status===409||e.status===403)return reload()})
 .then(function(){push.busy=0;if(push.again){push.again=0;push()}})}
function reload(){return api("GET","/api/ficha").then(function(r){db=mig(r.datos);VER=r.version;if(ME&&ME.estado==="APROBADO")render()})}
window.addEventListener("pagehide",function(){if(!save.t)return;clearTimeout(save.t);try{fetch("/api/ficha",{method:"PUT",keepalive:true,credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({datos:doc(),version:VER})})}catch(e){}});
// Datos que el prototipo dejó en este navegador, para ofrecer subirlos.
function localData(){try{var d=JSON.parse(localStorage.getItem(KEY)||"null");if(!d)return null;d=mig(d);return d.sesiones.length||d.motos.length||Object.keys(d.perfil).length?d:null}catch(e){return null}}

/* PLANES (simulados durante la beta) */
var PLANES=[["GRATIS","Gratis","$0",["Perfil y ficha de emergencia","Registro de tiempos en una pista"]],
 ["PLUS","Plus","$1 al mes",["Todo lo del plan Gratis","Pistas ilimitadas","Motos: piñón, catalina, neumáticos y ajustes","Trazado, sensaciones y rendimiento","Estadísticas e imágenes para compartir"]],
 ["PRO","Pro","$5 al mes",["Todo lo del plan Plus","Descuentos en marcas","Material educativo y de capacitación"]]];
var NV={GRATIS:0,PLUS:1,PRO:2};
function niv(){return ME?NV[ME.planEfectivo]||0:0}
function pName(id){var p=PLANES.filter(function(x){return x[0]===id})[0];return p?p[1]:id}
function planCards(sel,fn){return '<div class="pl">'+PLANES.map(function(p){return '<button type="button" class="pc'+(p[0]===sel?" on":"")+'" onclick="'+fn+'(\''+p[0]+'\')"><h3>'+p[1]+'</h3><div class="pr">'+p[2]+'</div><ul>'+p[3].map(function(x){return '<li>'+x+'</li>'}).join("")+'</ul></button>'}).join("")+'</div><p class="mu">Beta: los planes de pago son simulados. No se cobra nada.</p>'}
// Bloque que exige un plan: si no alcanza, se muestra gris y sin edición.
function L(n,title,inner){var ok=niv()>=n;return '<fieldset'+(ok?'':' disabled class="lk"')+'><legend>'+title+(ok?'':' <span class="lkn">🔒 Plan '+(n===2?"Pro":"Plus")+' · <button type="button" class="lnk" onclick="go(\'plan\')">Ver planes</button></span>')+'</legend>'+inner+'</fieldset>'}
function lockCard(n,t,d){return '<div class="t"><h3>🔒 '+t+'</h3><p class="mu" style="margin:4px 0 10px">'+d+' Disponible desde el plan '+(n===2?"Pro ($5 al mes)":"Plus ($1 al mes)")+'.</p><button class="btn" onclick="go(\'plan\')">Ver planes</button></div>'}
/* APP INSTALABLE Y NOTIFICACIONES */
var INST=null;
function standalone(){return matchMedia("(display-mode: standalone)").matches||navigator.standalone===true}
function iOS(){return /iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1)}
if("serviceWorker" in navigator)window.addEventListener("load",function(){navigator.serviceWorker.register("/sw.js").catch(function(){})});
window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();INST=e;if(ME&&(cur==="inicio"||cur==="datos"))render()});
window.addEventListener("appinstalled",function(){INST=null;toast("RR Piloto quedó instalada ✓");if(ME)render()});
function instalar(){if(INST){INST.prompt();INST.userChoice.then(function(){INST=null;render()});return}
 toast(iOS()?"En Safari toca Compartir (□↑) y luego «Agregar a inicio».":"Abre el menú del navegador y elige «Instalar aplicación».")}
function instBox(){if(standalone()||(!INST&&!iOS()))return "";
 return '<div class="t"><b>📲 Instala RR Piloto en tu teléfono</b><div class="mu">Ábrela como una app, sin buscarla en el navegador.'+(iOS()&&!INST?' En Safari: Compartir (□↑) → «Agregar a inicio».':"")+'</div><div class="row" style="margin:8px 0 0"><button class="btn" onclick="instalar()">Instalar app</button></div></div>'}
function notifEstado(){if(!("Notification" in window)||!("serviceWorker" in navigator))return iOS()&&!standalone()?"ios":"no";return Notification.permission}
function notifBox(){var s=notifEstado(),t={granted:"✅ Activadas en este dispositivo.",denied:"Bloqueadas. Actívalas desde los ajustes del navegador para este sitio.",ios:"En iPhone, primero instala la app en tu pantalla de inicio y ábrela desde ahí.",no:"Este navegador no permite notificaciones.","default":"Te avisaremos de novedades, eventos y recordatorios de Rubus Racing."}[s];
 return '<fieldset><legend>Notificaciones</legend><p class="mu" style="margin:0 0 10px">'+t+'</p>'+(s==="default"?'<button class="btn" onclick="notifOn()">🔔 Activar notificaciones</button>':s==="granted"?'<button class="btn s" onclick="notifTest()">Enviar notificación de prueba</button>':"")+'</fieldset>'}
function notifOn(){Notification.requestPermission().then(function(p){if(p==="granted")notifTest();render()})}
function notifTest(){navigator.serviceWorker.ready.then(function(r){return r.showNotification("RR Piloto",{body:"Las notificaciones están activadas ✓",icon:"/icons/icon-192.png",badge:"/icons/icon-192.png"})}).catch(function(){toast("No se pudo mostrar la notificación.")})}
function hdr(){if(!ME)return;$("#sub").innerHTML='Rubus Racing · Beta <button class="pill" onclick="go(\'plan\')">Plan '+esc(pName(ME.planEfectivo))+'</button>'}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function uid(){return String(Date.now())+Math.floor(Math.random()*999)}


function field(f,v){var k=f[0],l=f[1],t=f[2]||"text",c=f[3]==="full"?" full":"",val=v&&v[k]!=null?v[k]:"",n=' name="'+k+'"';
 if(Array.isArray(t)){var o=t.slice();if(val&&o.indexOf(val)<0)o.push(val);return '<label class="'+c+'">'+l+'<select'+n+'>'+o.map(function(x){return '<option'+(x===val?" selected":"")+'>'+esc(x)+'</option>'}).join("")+'</select></label>'}
 if(t==="textarea")return '<label class="full">'+l+'<textarea'+n+'>'+esc(val)+'</textarea></label>';
 return '<label class="'+c+'">'+l+'<input type="'+t+'"'+(t==="number"?' step="any"':"")+n+' value="'+esc(val)+'"'+(k==="rut"?' placeholder="12.345.678-9"':"")+'></label>'}
function sections(S,d){return S.map(function(s){return '<fieldset><legend>'+s[0]+'</legend><div class="g">'+s[1].map(function(f){return field(f,d)}).join("")+'</div></fieldset>'}).join("")}
function fs(title,fields,d,extra){return '<fieldset><legend>'+title+'</legend><div class="g">'+fields.map(function(f){return field(f,d)}).join("")+'</div>'+(extra||"")+'</fieldset>'}
function read(form){var o={};new FormData(form).forEach(function(v,k){o[k]=v});return o}

function toMs(s){s=String(s||"").trim().replace(",",".");if(!s)return null;var m=s.match(/^(?:(\d+):)?(\d+(?:\.\d+)?)$/);if(!m)return null;return Math.round(((+m[1]||0)*60+parseFloat(m[2]))*1000)}
function fmt(ms){if(ms==null)return "—";var m=Math.floor(ms/60000),s=((ms%60000)/1000).toFixed(3);return m+":"+(s<10?"0":"")+s}
function hm(m){m=Math.round(m||0);var h=Math.floor(m/60);return h?h+" h "+(m%60)+" min":m+" min"}
function nk(c){return String(c||"").trim().toLowerCase()}
function sTot(s){var m=0,v=0,b=null;(s.entradas||[]).forEach(function(e){m+=+e.minutos||0;v+=+e.vueltas||0;var x=toMs(e.mejor);if(x&&(b==null||x<b))b=x});return{m:m,v:v,b:b}}
function cStats(c,ex){var r={n:0,m:0,e:0,b:null,bf:""};if(!nk(c))return r;db.sesiones.forEach(function(s){if(s.id===ex||nk(s.circuito)!==nk(c))return;var t=sTot(s);r.n++;r.m+=t.m;r.e+=(s.entradas||[]).length;if(t.b&&(r.b==null||t.b<r.b)){r.b=t.b;r.bf=s.fecha}});return r}
function mName(m){return m.apodo||((m.marca||"")+" "+(m.modelo||"")).trim()||"Moto sin nombre"}
function groups(){var g={},o=[];db.sesiones.forEach(function(s){var k=nk(s.circuito);if(!k)return;if(!g[k]){g[k]={k:k,n:s.circuito,s:[]};o.push(g[k])}g[k].s.push(s)});
 o.forEach(function(x){x.s.sort(function(a,b){return (a.fecha||"").localeCompare(b.fecha||"")});x.m=0;x.e=0;x.b=null;x.bf="";x.s.forEach(function(s){var t=sTot(s);x.m+=t.m;x.e+=(s.entradas||[]).length;if(t.b&&(x.b==null||t.b<x.b)){x.b=t.b;x.bf=s.fecha}})});
 o.sort(function(a,b){return b.m-a.m});return o}

var tabs=[["inicio","🏠","Inicio"],["perfil","👤","Piloto"],["moto","🏍️","Moto"],["ses","🏁","Sesiones"],["datos","📊","Datos"],["mat","🎓","Material"]],cur="inicio",flash="",editing=null,curMoto=null,dc=null,pend=null;
function nav(){$("#nav").innerHTML=tabs.map(function(t){return '<button class="'+(t[0]===cur?"on":"")+'" onclick="go(\''+t[0]+'\')"><b>'+t[1]+'</b>'+t[2]+'</button>'}).join("")}
function go(t){cur=t;editing=null;pend=null;nav();render();window.scrollTo(0,0)}
function render(){hdr();if(cur==="inicio")inicio();else if(cur==="perfil")perfil();else if(cur==="moto")moto();else if(cur==="ses")ses();else if(cur==="mat")mat();else if(cur==="plan")planView();else datos()}

var TC=[
"<p><b>1. Responsable.</b> Rubus Racing (rubusracing.cl) es la responsable de esta aplicación y del tratamiento de tus datos.</p>",
"<p><b>2. Qué datos pedimos.</b> Identificación y contacto, previsión y seguro, persona de contacto en caso de emergencia, información médica relevante, datos de tu moto y el registro de tus prácticas y carreras.</p>",
"<p><b>3. Para qué los usamos.</b></p><ul><li><b>Respaldo de emergencia:</b> si ocurre un accidente o emergencia durante una práctica, clase o evento de Rubus Racing, nuestro equipo podrá consultar tu ficha para avisar a tu contacto de emergencia y entregar la información relevante a los servicios de salud que te atiendan.</li><li><b>Seguimiento deportivo:</b> llevar el registro de tus sesiones, tiempos y progreso.</li><li><b>Comunicaciones:</b> solo si lo aceptas, enviarte información, novedades y eventos de Rubus Racing a tu correo.</li></ul>",
"<p><b>4. Datos de salud.</b> Son datos sensibles y se usan únicamente para el respaldo de emergencia. Es tu responsabilidad entregar información veraz y mantenerla actualizada. La ficha no constituye un diagnóstico ni reemplaza la atención médica.</p>",
"<p><b>5. Quién accede.</b> Solo el personal autorizado de Rubus Racing. No vendemos tus datos ni los cedemos a terceros, salvo a servicios de salud o autoridades ante una emergencia o un requerimiento legal.</p>",

 var o=x.createLinearGradient(0,0,0,H);o.addColorStop(0,"rgba(0,0,0,.6)");o.addColorStop(.4,"rgba(0,0,0,.15)");o.addColorStop(.6,"rgba(0,0,0,.35)");o.addColorStop(1,"rgba(0,0,0,.88)");x.fillStyle=o;x.fillRect(0,0,W,H);
 x.textAlign="left";if(S.logo)x.drawImage(S.logo,60,56,150,150);
 if(S.av){x.save();x.beginPath();x.arc(W-135,131,75,0,7);x.clip();x.drawImage(S.av,W-210,56,150,150);x.restore();x.strokeStyle="#fff";x.lineWidth=6;x.beginPath();x.arc(W-135,131,75,0,7);x.stroke()}
 if(S.mode==="stats")drawStats(x,W,H,S,FN);else drawSes(x,W,H,S,FN);
 x.textAlign="center";x.fillStyle="#bbb";x.font="500 22px "+FN;x.fillText("Desarrollado por Rubus Racing. Todos los derechos reservados.",W/2,H-28,1000);x.textAlign="left"}
function outp(){var cv=$("#cv"),om=$("#om");om.textContent="Preparando imagen…";
 cv.toBlob(function(b){
  var fb=function(){var im=$("#out");im.src=cv.toDataURL("image/png");im.style.display="block";om.textContent="Mantén presionada la imagen y elige Guardar en Fotos.";
   try{var f=new File([b],"rr-piloto.png",{type:"image/png"});if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f],title:"RR Piloto"}).catch(function(){})}catch(e){}};
  if(!(window.claude&&window.claude.use))return fb();
  window.claude.use("downloads").then(function(d){if(!d)return fb();
   var nm=SH.mode==="stats"?"numeros":(nk(SH.c).replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"sesion");
   return d.save({filename:"rr-piloto-"+nm+".png",data:b}).then(function(){om.textContent="Imagen lista ✓ Guárdala en Fotos y súbela a Instagram."},function(e){if(e&&e.code==="declined")om.textContent="Descarga cancelada.";else fb()})}).catch(fb)
 },"image/png")}

function del(id){var b=$("#d"+id);if(pend===id){db.sesiones=db.sesiones.filter(function(s){return s.id!==id});pend=null;save();ses()}else{pend=id;b.textContent="¿Seguro? Toca de nuevo"}}

/* DATOS */
function chart(P){if(!P.length)return '<p class="mu">Sin tiempos de vuelta registrados en esta pista.</p>';
 var W=600,H=220,L=62,R=14,T=14,B=30,a=P.map(function(p){return p.ms}),mn=Math.min.apply(0,a),mx=Math.max.apply(0,a);if(mn===mx){mn-=1000;mx+=1000}var pd=(mx-mn)*.12;mn-=pd;mx+=pd;
 function X(i){return P.length===1?L+(W-L-R)/2:L+i*(W-L-R)/(P.length-1)}function Y(v){return T+(v-mn)/(mx-mn)*(H-T-B)}
 var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Evolución de mejores vueltas">';
 [0,.5,1].forEach(function(q){var v=mn+q*(mx-mn),y=Y(v);s+='<line class="gl" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text class="ax" x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end">'+fmt(v)+'</text>'});
 var best=Math.min.apply(0,a);
 s+='<polyline class="ln" points="'+P.map(function(p,i){return X(i)+","+Y(p.ms)}).join(" ")+'"/>';
 P.forEach(function(p,i){s+='<circle class="'+(p.ms===best?"pb":"pt")+'" cx="'+X(i)+'" cy="'+Y(p.ms)+'" r="4.5"><title>'+esc(p.f)+" · "+fmt(p.ms)+'</title></circle>'});
 s+='<text class="ax" x="'+L+'" y="'+(H-8)+'">'+esc(P[0].f)+'</text>';if(P.length>1)s+='<text class="ax" x="'+(W-R)+'" y="'+(H-8)+'" text-anchor="end">'+esc(P[P.length-1].f)+'</text>';
 return s+'</svg><div class="mu">Mejor vuelta por sesión · más arriba = más rápido · punto verde = récord</div>'}

function datos(){var G=groups(),S=db.sesiones,tm=0,te=0,tv=0;
 S.forEach(function(s){var t=sTot(s);tm+=t.m;tv+=t.v;te+=(s.entradas||[]).length});
 var h='<div class="stats"><div class="st"><b>'+hm(tm)+'</b><small>Tiempo total en pista</small></div><div class="st"><b>'+S.length+'</b><small>Sesiones</small></div><div class="st"><b>'+te+'</b><small>Entradas a pista</small></div><div class="st"><b>'+tv+'</b><small>Vueltas</small></div><div class="st"><b>'+G.length+'</b><small>Pistas</small></div></div>';
 if(!G.length){h+='<p class="mu">Registra sesiones para ver tus datos por pista.</p>'}
 else{if(!dc||!G.filter(function(x){return x.k===dc}).length)dc=G[0].k;var g=G.filter(function(x){return x.k===dc})[0],mx=G[0].m||1,h0=h;h="";
  h+='<fieldset><legend>Tiempo en pista por circuito</legend>'+G.map(function(x){return '<div><span class="mu">'+esc(x.n)+' · '+hm(x.m)+'</span><div class="bar" style="width:'+Math.max(2,x.m/mx*100)+'%"></div></div>'}).join("")+'</fieldset>';
  h+='<fieldset><legend>Pistas con registros</legend><div class="tw"><table><thead><tr><th>Pista</th><th>Sesiones</th><th>Entradas</th><th>Tiempo total</th><th>Mejor tiempo</th><th>Fecha</th></tr></thead><tbody>'+G.map(function(x){return '<tr class="'+(x.k===dc?"sel":"")+'" onclick="dc=\''+x.k.replace(/'/g,"\\'")+'\';datos()"><td>'+esc(x.n)+'</td><td>'+x.s.length+'</td><td>'+x.e+'</td><td>'+hm(x.m)+'</td><td class="best">'+fmt(x.b)+'</td><td>'+esc(x.bf)+'</td></tr>'}).join("")+'</tbody></table></div><div class="mu" style="margin:8px 0">Toca una pista para ver su detalle.</div></fieldset>';
  var P=[];g.s.forEach(function(s){var t=sTot(s);if(t.b)P.push({f:s.fecha||"",ms:t.b})});
  h+='<fieldset><legend>'+esc(g.n)+': evolución</legend>'+chart(P)+'<div style="margin-top:12px"><b style="font-size:13px">Historial en esta pista</b></div><div class="tw"><table><thead><tr><th>Fecha</th><th>Tipo</th><th>Evento</th><th>Entrada</th><th>Clima</th><th>Tiempo</th><th>Mejor vuelta</th></tr></thead><tbody>'+hist(g)+'</tbody></table></div></fieldset>';
  h=h0+L(1,"Estadísticas por pista",h)}
 h+=cuenta();
 $("#v").innerHTML=h}
function cuenta(){var c=ME.consentimiento||{};
 return '<fieldset><legend>Mi cuenta</legend><p style="margin:0 0 6px"><b>'+esc(ME.email)+'</b></p><p class="mu" style="margin:0 0 10px">'+planTxt()+'</p>'
 +'<div class="row"><button class="btn" onclick="go(\'plan\')">Cambiar plan</button><button class="btn s" onclick="pwForm()">Cambiar contraseña</button>'+(standalone()?"":'<button class="btn s" onclick="instalar()">📲 Instalar app</button>')+'<button class="btn s" onclick="logout()">Cerrar sesión</button></div><div id="pw"></div></fieldset>'
 +notifBox()
 +'<fieldset><legend>Privacidad</legend><p class="mu">Términos aceptados el '+esc(c.fecha||"—")+' (versión '+esc(c.version||"—")+')</p><label class="ck"><input type="checkbox" '+(c.mailing?"checked":"")+' onchange="setMail(this)"><span>Quiero recibir información de Rubus Racing en mi correo</span></label><div class="row"><button class="btn s" onclick="gate(\'terms\',1)">Ver términos</button><button class="btn s" onclick="dl()">Descargar mis datos</button><button class="btn s" id="wipe" onclick="wipe()">Borrar mi cuenta y mis datos</button></div></fieldset>'}
function planTxt(){var t='Plan elegido: <b>'+esc(pName(ME.plan))+'</b>';if(ME.cortesia&&ME.planEfectivo===ME.cortesia)t+=' · Rubus Racing te asignó el plan <b>'+esc(pName(ME.cortesia))+'</b>'+(ME.cortesiaHasta?' hasta el '+esc(ME.cortesiaHasta):"")+' 🎁';return t}

 $("#pwf").onsubmit=function(e){e.preventDefault();api("PUT","/api/auth/password",read(e.target)).then(function(){$("#pw").innerHTML="";toast("Contraseña actualizada ✓")}).catch(function(x){$("#pwm").textContent=x.message})}}

function mat(){if(niv()<2){$("#v").innerHTML=lockCard(2,"Material y beneficios","Accede a material educativo y de capacitación teórica de Rubus Racing, y a descuentos en marcas asociadas.");return}
 if(!MAT){$("#v").innerHTML='<p class="mu">Cargando material…</p>';api("GET","/api/contenido").then(function(r){MAT=r.items;if(cur==="mat")mat()}).catch(function(e){$("#v").innerHTML='<p class="mu">'+esc(e.message)+'</p>'});return}
 function lst(t){var I=MAT.filter(function(x){return x.tipo===t});return I.length?I.map(function(x){return '<div class="mt"><h3>'+esc(x.titulo)+'</h3>'+(x.resumen?'<div class="mu">'+esc(x.resumen)+'</div>':"")+(x.cuerpo?'<p>'+esc(x.cuerpo)+'</p>':"")+(/^https?:\/\//.test(x.enlace||"")?'<a class="btn s" style="display:inline-block;text-decoration:none;margin-top:4px" href="'+esc(x.enlace)+'" target="_blank" rel="noopener">Abrir →</a>':"")+'</div>'}).join(""):'<p class="mu">Pronto agregaremos contenido aquí.</p>'}
 $("#v").innerHTML='<h2 style="margin:4px 0 12px;font-size:20px">Material y beneficios</h2><fieldset><legend>🎓 Material educativo</legend>'+lst("MATERIAL")+'</fieldset><fieldset><legend>🏷️ Descuentos en marcas</legend>'+lst("BENEFICIO")+'</fieldset>'}
function hist(g){var R=[];g.s.forEach(function(s){(s.entradas||[]).forEach(function(e,i){R.push([s,e,i])})});return R.reverse().map(function(r){var s=r[0],e=r[1],m=toMs(e.mejor);return '<tr style="cursor:default"><td>'+esc(s.fecha)+'</td><td>'+esc(s.tipo)+'</td><td>'+esc(s.evento)+'</td><td>'+(r[2]+1)+'</td><td>'+esc(e.clima)+'</td><td>'+(e.minutos?esc(e.minutos)+" min":"—")+'</td><td class="'+(m&&m===g.b?"best":"")+'">'+(m?fmt(m):esc(e.mejor||"—"))+'</td></tr>'}).join("")}
