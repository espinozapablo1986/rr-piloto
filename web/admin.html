<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Administración · RR Piloto</title>
<style>
:root{--bg:#f6f6f4;--card:#fff;--tx:#1b1b1b;--mu:#6b6b66;--bd:#dcdcd6;--ac:#d4232a;--ac2:#fff;--ok:#1f8a4c;--wa:#b26a00}
@media(prefers-color-scheme:dark){:root{--bg:#121212;--card:#1d1d1d;--tx:#eee;--mu:#9a9a94;--bd:#333;--ac:#ef4a50;--ac2:#111;--ok:#4cc27f;--wa:#e0a040}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--bd)}
.hw{max-width:1100px;margin:0 auto;padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
h1{font-size:19px;margin:0}h1 span{color:var(--ac)}
.tabs{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
main{max-width:1100px;margin:0 auto;padding:16px}
.btn{padding:9px 14px;border:0;border-radius:8px;background:var(--ac);color:var(--ac2);font:inherit;font-weight:600;cursor:pointer}
.btn.s{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.btn.ok{background:var(--ok);color:var(--ac2)}
.btn.on{outline:2px solid var(--ac);outline-offset:-2px}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
fieldset{border:1px solid var(--bd);background:var(--card);border-radius:10px;margin:0 0 16px;padding:14px;min-width:0}
legend{font-weight:700;padding:0 6px;color:var(--ac)}
label{display:block;font-size:13px;color:var(--mu);margin:0 0 12px}
input,select,textarea{display:block;width:100%;margin-top:5px;padding:10px;border:1px solid var(--bd);border-radius:7px;background:var(--bg);color:var(--tx);font:inherit;font-size:15px}
textarea{min-height:110px;resize:vertical}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:4px 14px}
.full{grid-column:1/-1}
.mu{color:var(--mu);font-size:13px}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--bd);white-space:nowrap;vertical-align:middle}
th{color:var(--mu);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.3px}
tbody tr:hover td{background:var(--bg)}
tr.ck td{cursor:pointer}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:20px;border:1px solid currentColor}
.PENDIENTE{color:var(--wa)}.APROBADO{color:var(--ok)}.RECHAZADO{color:var(--ac)}
.dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:2px 18px;margin:0}
.dl div{padding:6px 0;border-bottom:1px dashed var(--bd)}
.dl dt{font-size:12px;color:var(--mu)}.dl dd{margin:0;white-space:pre-wrap;word-break:break-word}
.em{border-color:var(--ac)}
.auth{max-width:380px;margin:40px auto}
.msg{font-size:14px;margin-left:4px}
.cnt{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--wa);color:#fff;font-size:12px;margin-left:4px}
.av{width:64px;height:64px;border-radius:50%;object-fit:cover;border:3px solid var(--ac)}
svg.ic{flex:none;vertical-align:-3px}
.btn{display:inline-flex;align-items:center;gap:6px}
.ttl{display:flex;align-items:center;gap:8px}
.kps{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:0 0 6px}
.kp{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;min-width:0}
.kp b{display:block;font-size:24px;line-height:1.2}.kp span{display:block;font-size:13px;color:var(--mu)}.kp small{display:block;font-size:12px;color:var(--mu);margin-top:2px}
.kp.al b{color:var(--wa)}.kp.ok b{color:var(--ok)}
.c2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(460px,100%),1fr));gap:0 16px}
.vb{display:flex;align-items:flex-end;gap:6px;height:130px;padding:8px 0 0}
.vb div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.vb i{display:block;width:100%;max-width:34px;background:var(--ac);border-radius:4px 4px 0 0;min-height:2px}
.vb em{font-style:normal;font-size:11px;color:var(--mu);margin-top:4px}.vb s{text-decoration:none;font-size:11px;font-weight:700;margin-bottom:2px}
.hb{height:12px;border-radius:6px;display:flex;overflow:hidden;background:var(--bd);margin:6px 0 4px}
.hb i{display:block;height:100%}
.chk{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.chk label{display:inline-flex;align-items:center;gap:7px;margin:0;padding:7px 11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:14px;cursor:pointer}
.chk input{width:auto;margin:0}
.bn{width:150px;aspect-ratio:3/1;object-fit:cover;border-radius:6px;background:var(--bg);display:block}
.lnk{border:0;background:none;color:var(--tx);font:inherit;font-weight:700;cursor:pointer;padding:0;text-align:left}
.lnk:hover{color:var(--ac)}
select.f{width:auto;margin:0}
</style>
</head>
<body>
<header><div class="hw"><h1>RR <span>Piloto</span> · Administración</h1><div class="tabs" id="tabs"></div></div></header>
<main id="v"><p class="mu">Cargando…</p></main>
<script src="iconos.js"></script>
<script src="campos.js"></script>
<script>
var $=function(s){return document.querySelector(s)},ME=null,U=[],C=[],A=[],CI=null,CQ="",DB=null,DF={deporte:"",dias:90},CSEL="",cur="dash",filtro="PENDIENTE",q="";
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function api(m,u,b){if(b===undefined&&m!=="GET")b={};
 return fetch(u,{method:m,credentials:"same-origin",headers:b!==undefined?{"Content-Type":"application/json"}:{},body:b!==undefined?JSON.stringify(b):undefined})
 .then(function(r){return r.json().catch(function(){return{}}).then(function(j){if(!r.ok){var e=new Error(j.error||"Error del servidor.");e.status=r.status;throw e}return j})})}
function read(f){var o={};new FormData(f).forEach(function(v,k){o[k]=v});return o}
var PN={GRATIS:"Gratis",PLUS:"Plus ($1)",PRO:"Pro ($5)"},EN={PENDIENTE:"Pendiente",APROBADO:"Aprobado",RECHAZADO:"Rechazado"};
function fd(d){return d?String(d).slice(0,10):"—"}

function boot(){api("GET","/api/auth/me").then(function(r){ME=r.user;if(ME.rol!=="ADMIN"){$("#v").innerHTML='<div class="auth"><h2>Sin acceso</h2><p class="mu">Tu cuenta no es de administrador.</p><div class="row"><a class="btn s" href="/" style="text-decoration:none">Ir a la app</a><button class="btn s" onclick="salir()">Cerrar sesión</button></div></div>';return}tabs();go(cur)})
 .catch(function(e){if(e.status===401)login();else $("#v").innerHTML='<p class="mu">'+esc(e.message)+'</p>'})}
function login(){$("#tabs").innerHTML="";$("#v").innerHTML='<div class="auth"><h2>Ingreso de administrador</h2><form id="lf"><fieldset><label>Correo<input type="email" name="email" autocomplete="username" required></label><label>Contraseña<input type="password" name="password" autocomplete="current-password" required></label><button class="btn" type="submit">Entrar</button><span class="msg" id="lm"></span></fieldset></form></div>';
 $("#lf").onsubmit=function(e){e.preventDefault();api("POST","/api/auth/login",read(e.target)).then(boot).catch(function(x){$("#lm").textContent=x.message})}}
function salir(){api("POST","/api/auth/logout").then(login,login)}
function tabs(){var p=DB?DB.kpis.pendientes:U.filter(function(u){return u.estado==="PENDIENTE"}).length;
 function b(t,i,l,x){return '<button class="btn s'+(cur===t?" on":"")+'" onclick="go(\''+t+'\')">'+ic(i,16)+l+(x||"")+'</button>'}
 $("#tabs").innerHTML=b("dash","panel","Dashboard")+b("pil","usuarios","Pilotos",p?'<span class="cnt">'+p+'</span>':"")+b("pis","mapa","Pistas",DB&&DB.kpis.circuitosPendientes?'<span class="cnt">'+DB.kpis.circuitosPendientes+'</span>':"")+b("rec","premio","Recompensas")+b("ads","anuncio","Anuncios")+b("mat","material","Material Pro")+'<button class="btn s" onclick="pwd()">'+ic("llave",16)+'Mi contraseña</button><button class="btn s" onclick="salir()">'+ic("salir",16)+'Salir</button>'}
function go(t){cur=t;if(t==="pil")pilotos();else if(t==="dash")dashboard();else if(t==="ads")anuncios();else if(t==="pis")pistas();else if(t==="rec")recompensas();else material();window.scrollTo(0,0)}

/* PILOTOS */
function pilotos(){api("GET","/api/admin/usuarios").then(function(r){U=r.usuarios;tabs();lista()}).catch(err)}
function lista(){var n={TODOS:U.length};U.forEach(function(u){n[u.estado]=(n[u.estado]||0)+1});
 var L=U.filter(function(u){return (filtro==="TODOS"||u.estado===filtro)&&(!q||(u.nombre+" "+u.email+" "+u.rut).toLowerCase().indexOf(q)>=0)});
 var h='<div class="row">'+["PENDIENTE","APROBADO","RECHAZADO","TODOS"].map(function(f){return '<button class="btn s'+(f===filtro?" on":"")+'" onclick="filtro=\''+f+'\';lista()">'+(EN[f]||"Todos")+'s'.slice(f==="TODOS"?1:0)+' ('+(n[f]||0)+')</button>'}).join("")+'<input id="q" placeholder="Buscar por nombre, correo o RUT" value="'+esc(q)+'" style="max-width:300px;margin:0" oninput="q=this.value.trim().toLowerCase();lista();var i=$(\'#q\');i.focus();i.setSelectionRange(i.value.length,i.value.length)"></div>';
 h+=L.length?'<div class="tw"><table><thead><tr><th>Piloto</th><th>Correo</th><th>RUT</th><th>Deportes</th><th>Registro</th><th>Plan</th><th>Sesiones</th><th>Estado</th><th></th></tr></thead><tbody>'+L.map(function(u){
  return '<tr class="ck" onclick="ficha(\''+u.id+'\')"><td><b>'+esc(u.nombre||"(sin nombre)")+'</b></td><td>'+esc(u.email)+'</td><td>'+esc(u.rut||"—")+'</td><td>'+deps(u.deportes)+'</td><td>'+fd(u.creado)+'</td><td>'+esc(PN[u.planEfectivo])+(u.cortesia&&u.cortesia===u.planEfectivo?' '+ic("regalo",14):"")+'</td><td>'+u.sesiones+'</td><td><span class="tag '+u.estado+'">'+EN[u.estado]+'</span></td><td onclick="event.stopPropagation()">'
  +(u.estado!=="APROBADO"?'<button class="btn ok" onclick="estado(\''+u.id+'\',\'APROBADO\')">Aprobar</button> ':"")+(u.estado==="PENDIENTE"?'<button class="btn s" onclick="estado(\''+u.id+'\',\'RECHAZADO\')">Rechazar</button>':"")+'</td></tr>'}).join("")+'</tbody></table></div>':'<p class="mu">No hay pilotos en esta lista.</p>';
 $("#v").innerHTML=h}
function deps(d,largo){return (d&&d.length?d:["moto"]).map(function(x){var o=dep(x);return '<span title="'+esc(o[1])+'" style="display:inline-flex;align-items:center;gap:4px;margin-right:8px">'+ic(o[2],15)+(largo?esc(o[1]):"")+'</span>'}).join("")}
function estado(id,e,back){api("PATCH","/api/admin/usuarios/"+id,{estado:e}).then(function(){if(back)ficha(id);else pilotos()}).catch(err)}
function err(e){if(e.status===401)return login();alert(e.message)}

function dl(sec,d){var h="";sec.forEach(function(s){var it=s[1].filter(function(f){return d[f[0]]});if(!it.length)return;
 h+='<h4 style="margin:14px 0 4px">'+esc(s[0])+'</h4><dl class="dl">'+it.map(function(f){return '<div><dt>'+esc(f[1])+'</dt><dd>'+esc(d[f[0]])+'</dd></div>'}).join("")+'</dl>'});return h||'<p class="mu">Sin datos.</p>'}
function best(s){var b=null;(s.entradas||[]).forEach(function(e){var m=String(e.mejor||"").trim().replace(",",".").match(/^(?:(\d+):)?(\d+(?:\.\d+)?)$/);if(m){var x=(+m[1]||0)*60+parseFloat(m[2]);if(b==null||x<b)b=x}});if(b==null)return "—";var mm=Math.floor(b/60),ss=(b%60).toFixed(3);return mm+":"+(ss<10?"0":"")+ss}

function ficha(id){api("GET","/api/admin/usuarios/"+id).then(function(r){var u=r.usuario,d=r.datos||{},p=d.perfil||{},c=u.consentimiento||{},S=(d.sesiones||[]).slice().sort(function(a,b){return String(b.fecha||"").localeCompare(String(a.fecha||""))}),M=d.motos||[];
 var em=PERFIL.filter(function(s){return /emergencia|médica/i.test(s[0])}),ot=PERFIL.filter(function(s){return em.indexOf(s)<0});
 var h='<div class="row"><button class="btn s" onclick="go(\'pil\')">← Volver a la lista</button></div>'
 +'<div class="row" style="gap:14px">'+(d.foto?'<img class="av" src="'+esc(d.foto)+'" alt="">':"")+'<div><h2 style="margin:0">'+esc(p.nombre||u.email)+'</h2><div class="mu">'+esc(u.email)+' · registrado el '+fd(u.creado)+(u.aprobado?' · aprobado el '+fd(u.aprobado):"")+'</div><div class="mu" style="margin-top:4px">'+deps(u.deportes,1)+(u.planEfectivo==="PRO"?' · Anuncios: '+(u.anunciosPro?"activados":"desactivados"):"")+'</div></div></div>'
 +'<fieldset><legend>Cuenta y plan</legend><div class="row">Estado: <span class="tag '+u.estado+'">'+EN[u.estado]+'</span>'
 +(u.estado!=="APROBADO"?'<button class="btn ok" onclick="estado(\''+u.id+'\',\'APROBADO\',1)">Aprobar</button>':"")+(u.estado!=="RECHAZADO"?'<button class="btn s" onclick="estado(\''+u.id+'\',\'RECHAZADO\',1)">Rechazar</button>':"")+(u.estado==="RECHAZADO"?'<button class="btn s" onclick="estado(\''+u.id+'\',\'PENDIENTE\',1)">Volver a pendiente</button>':"")+'</div>'
 +'<form id="pf"><div class="g"><label>Plan elegido por el piloto (simulado)<select name="plan">'+opts(u.plan)+'</select></label><label>Plan de cortesía (fidelización)<select name="cortesia"><option value="">Sin cortesía</option>'+opts(u.cortesiaGuardada,1)+'</select></label><label>Cortesía válida hasta (vacío = sin término)<input type="date" name="cortesiaHasta" value="'+esc(u.cortesiaHastaGuardada||"")+'"></label></div>'
 +'<div class="row"><button class="btn" type="submit">Guardar plan</button><span class="mu">Plan vigente: <b>'+esc(PN[u.planEfectivo])+'</b></span><span class="msg" id="pm"></span></div></form>'
 +'<p class="mu" style="margin:0">Términos v'+esc(c.version||"—")+' aceptados el '+esc(c.fecha||"—")+' · Mailing: '+(c.mailing?"sí":"no")+(c.menor?' · <b>Menor de edad</b>, apoderado: '+esc(c.tutor)+' ('+esc(c.tutorRut)+')':"")+'</p></fieldset>'
 +'<fieldset class="em"><legend class="ttl">'+ic("escudo",16)+'Emergencia y salud</legend>'+dl(em,p)+'</fieldset>'
 +'<fieldset><legend>Ficha del piloto</legend>'+dl(ot,p)+'</fieldset>'
 +'<fieldset><legend>Motos ('+M.length+')</legend>'+(M.length?M.map(function(m){return '<h4 style="margin:10px 0 0">'+esc(m.apodo||((m.marca||"")+" "+(m.modelo||"")).trim()||"Moto")+'</h4>'+(m.foto?'<img src="'+esc(m.foto)+'" alt="" style="width:240px;max-width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;margin:6px 0">':"")+dl(MOTO,m)}).join(""):'<p class="mu">Sin motos registradas.</p>')+'</fieldset>'
 +'<fieldset><legend>Sesiones ('+S.length+')</legend>'+(S.length?'<div class="tw" style="border:0"><table><thead><tr><th>Fecha</th><th>Circuito</th><th>Tipo</th><th>Evento</th><th>Entradas</th><th>Mejor vuelta</th></tr></thead><tbody>'+S.map(function(s){return '<tr><td>'+esc(s.fecha)+'</td><td>'+esc(s.circuito)+'</td><td>'+esc(s.tipo)+'</td><td>'+esc(s.evento)+'</td><td>'+(s.entradas||[]).length+'</td><td>'+best(s)+'</td></tr>'}).join("")+'</tbody></table></div>':'<p class="mu">Sin sesiones registradas.</p>')+'</fieldset>'
 +'<div class="row"><button class="btn s" id="delu" onclick="delU(\''+u.id+'\')">Eliminar cuenta del piloto</button></div>';
 $("#v").innerHTML=h;window.scrollTo(0,0);
 $("#pf").onsubmit=function(e){e.preventDefault();var o=read(e.target);api("PATCH","/api/admin/usuarios/"+u.id,{plan:o.plan,cortesia:o.cortesia||null,cortesiaHasta:o.cortesia&&o.cortesiaHasta?o.cortesiaHasta:null}).then(function(){ficha(u.id)}).catch(function(x){$("#pm").textContent=x.message})}}).catch(err)}
function opts(sel,sinGratis){return ["GRATIS","PLUS","PRO"].filter(function(p){return !sinGratis||p!=="GRATIS"}).map(function(p){return '<option value="'+p+'"'+(p===sel?" selected":"")+'>'+PN[p]+'</option>'}).join("")}
var pend=null;
function delU(id){var b=$("#delu");if(pend!==id){pend=id;b.textContent="¿Seguro? Se borra la cuenta y toda su ficha. Toca de nuevo";return}pend=null;api("DELETE","/api/admin/usuarios/"+id).then(function(){go("pil")}).catch(err)}

/* MATERIAL PRO */
function material(){api("GET","/api/admin/contenido").then(function(r){C=r.items;tabs();
 var h='<p class="mu">Módulo provisorio: lo que publiques aquí lo ven los pilotos con plan Pro en la pestaña Material. Más adelante el material educativo pasará a una plataforma propia.</p><div class="row"><button class="btn" onclick="cform()">+ Nuevo contenido</button></div>';
 h+=C.length?'<div class="tw"><table><thead><tr><th>Título</th><th>Categoría</th><th>Tipo</th><th>Orden</th><th>Estado</th><th>Actualizado</th></tr></thead><tbody>'+C.map(function(c){return '<tr class="ck" onclick="cform(\''+c.id+'\')"><td><b>'+esc(c.titulo)+'</b><div class="mu">'+esc(c.resumen||"")+'</div></td><td>'+esc(c.categoria||"—")+'</td><td>'+(/youtu|vimeo|\.(mp4|webm|mov)(\?|$)/i.test(c.enlace||"")?ic("play",15)+" ":"")+(c.tipo==="MATERIAL"?ic("material",15)+" Material":ic("etiqueta",15)+" Descuento")+'</td><td>'+c.orden+'</td><td>'+(c.publicado?'<span class="tag APROBADO">Publicado</span>':'<span class="tag PENDIENTE">Borrador</span>')+'</td><td>'+fd(c.actualizado)+'</td></tr>'}).join("")+'</tbody></table></div>':'<p class="mu">Aún no hay contenido.</p>';
 $("#v").innerHTML=h}).catch(err)}
function cform(id){var c=C.filter(function(x){return x.id===id})[0]||{tipo:"MATERIAL",publicado:true,orden:0};
 $("#v").innerHTML='<div class="row"><button class="btn s" onclick="go(\'mat\')">← Volver</button></div><form id="cf"><fieldset><legend>'+(id?"Editar":"Nuevo")+' contenido</legend><div class="g"><label>Tipo<select name="tipo"><option value="MATERIAL"'+(c.tipo==="MATERIAL"?" selected":"")+'>Material educativo</option><option value="BENEFICIO"'+(c.tipo==="BENEFICIO"?" selected":"")+'>Descuento en marca</option></select></label><label>Orden (menor aparece primero)<input type="number" name="orden" value="'+esc(c.orden)+'"></label><label class="full">Título<input name="titulo" required value="'+esc(c.titulo)+'"></label><label>Categoría (agrupa el material en la app)<input name="categoria" list="cats" placeholder="Ej. Técnica de manejo" value="'+esc(c.categoria)+'"><datalist id="cats">'+cats()+'</datalist></label><label class="full">Resumen (una línea)<input name="resumen" value="'+esc(c.resumen)+'"></label><label class="full">Contenido / instrucciones (por ejemplo, el código de descuento)<textarea name="cuerpo">'+esc(c.cuerpo)+'</textarea></label><label class="full">Enlace: los videos de YouTube o Vimeo y los archivos .mp4 se muestran embebidos; PDF y otros sitios, como botón<input name="enlace" placeholder="https://www.youtube.com/watch?v=…" value="'+esc(c.enlace)+'"></label><label><input type="checkbox" name="publicado" style="display:inline;width:auto"'+(c.publicado?" checked":"")+'> Publicado</label></div>'
 +'<div class="row"><button class="btn" type="submit">Guardar</button>'+(id?'<button class="btn s" type="button" id="delc" onclick="delC(\''+id+'\')">Eliminar</button>':"")+'<span class="msg" id="cm"></span></div></fieldset></form>';
 $("#cf").onsubmit=function(e){e.preventDefault();var o=read(e.target),b={tipo:o.tipo,titulo:o.titulo,categoria:o.categoria,resumen:o.resumen,cuerpo:o.cuerpo,enlace:o.enlace.trim(),publicado:!!o.publicado,orden:parseInt(o.orden,10)||0};
  api(id?"PUT":"POST","/api/admin/contenido"+(id?"/"+id:""),b).then(function(){go("mat")}).catch(function(x){$("#cm").textContent=x.message+(x.details?" "+x.details.join(" "):"")})}}
function cats(){var u={};C.forEach(function(x){if(x.categoria)u[x.categoria]=1});return Object.keys(u).sort().map(function(k){return '<option value="'+esc(k)+'">'}).join("")}
function delC(id){var b=$("#delc");if(pend!==id){pend=id;b.textContent="¿Seguro? Toca de nuevo";return}pend=null;api("DELETE","/api/admin/contenido/"+id).then(function(){go("mat")}).catch(err)}

function recargarC(id,apr,msg){api("GET","/api/admin/circuitos").then(function(r){CI=r;circForm(id,apr);if(msg&&$("#fm"))$("#fm").textContent=msg}).catch(err)}
// Se reduce a 1600 px por lado y JPEG al 80 % antes de subirla.
function fotoUp(inp,id,apr){var f=inp.files&&inp.files[0];inp.value="";if(!f)return;$("#fm").textContent="Subiendo…";var r=new FileReader();r.onload=function(){var i=new Image();i.onload=function(){var k=Math.min(1,1600/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext("2d").drawImage(i,0,0,c.width,c.height);
 api("POST","/api/admin/circuitos/"+id+"/imagenes",{datos:c.toDataURL("image/jpeg",.8)}).then(function(){recargarC(id,apr,"Foto agregada ✓")}).catch(function(x){$("#fm").textContent=x.message})};i.src=r.result};r.readAsDataURL(f)}
function fotoPrin(id,img,apr){api("POST","/api/admin/circuitos/"+id+"/imagenes/"+img+"/principal").then(function(){recargarC(id,apr)}).catch(err)}
function fotoDel(id,img,apr){if(!confirm("¿Quitar esta foto?"))return;api("DELETE","/api/admin/circuitos/"+id+"/imagenes/"+img).then(function(){recargarC(id,apr)}).catch(err)}
function cnuevo(i){var x=CI.sueltos[i];circForm(null,0,{nombre:x.nombre,deportes:[],trazados:[],pais:"Chile",vincular:[x.nombre]})}
function fusionar(id){var d=$("#fu"+id).value;if(!d)return alert("Elige con qué circuito fusionarlo.");api("POST","/api/admin/circuitos/"+id+"/fusionar",{destinoId:d}).then(function(r){pistas()}).catch(err)}
function asignar(i,dst){var x=CI.sueltos[i],d=dst||$("#su"+i).value;if(!d)return alert("Elige el circuito.");api("POST","/api/admin/circuitos/vincular",{nombre:x.nombre,destinoId:d}).then(function(){pistas()}).catch(err)}
function rechazarC(id){if(!confirm("¿Rechazar esta solicitud? Las sesiones del piloto conservan el nombre escrito."))return;api("POST","/api/admin/circuitos/"+id+"/rechazar").then(function(){pistas()}).catch(err)}
function delCir(id){var b=$("#delc2");if(pend!==id){pend=id;b.textContent="¿Seguro? Las sesiones conservan el nombre. Toca de nuevo";return}pend=null;api("DELETE","/api/admin/circuitos/"+id).then(function(){pistas()}).catch(err)}

/* RECOMPENSAS por nivel (solo cuentas Plus y Pro) */
var RW=[];
function nivNom(n){var x=PREMIOS.niveles[n-1];return "Nivel "+n+" · "+(x?x[1]:"")}
function recompensas(){api("GET","/api/admin/recompensas").then(function(r){RW=r.items;tabs();
 var h='<div class="row"><h2 class="ttl" style="margin:0 auto 0 0">'+ic("premio",22)+'Recompensas</h2><button class="btn" onclick="rform()">'+ic("mas",16)+'Nueva recompensa</button></div><p class="mu">Premios y descuentos que se desbloquean al subir de nivel. Solo los ven las cuentas Plus y Pro; el código se entrega cuando el piloto alcanza el nivel. Puntos: 1 por minuto en pista y '+PREMIOS.puntosRecord+' por cada récord personal.</p>'
 +'<fieldset><legend>Niveles</legend><div class="kps">'+PREMIOS.niveles.map(function(x,i){return kp(x[1],"Nivel "+(i+1),x[0]+" puntos")}).join("")+'</div></fieldset>';
 h+=RW.length?'<div class="tw"><table><thead><tr><th>Nivel</th><th>Recompensa</th><th>Sponsor</th><th>Código</th><th>Estado</th></tr></thead><tbody>'+RW.map(function(x){return '<tr class="ck" onclick="rform(\''+x.id+'\')"><td>'+esc(nivNom(x.nivel))+'</td><td><b>'+esc(x.titulo)+'</b><div class="mu">'+esc(x.descripcion||"")+'</div></td><td>'+esc(x.sponsor||"—")+'</td><td>'+esc(x.codigo||"—")+'</td><td>'+(x.activo?'<span class="tag APROBADO">Activa</span>':'<span class="tag PENDIENTE">Pausada</span>')+'</td></tr>'}).join("")+'</tbody></table></div>':'<p class="mu">Aún no hay recompensas.</p>';
 $("#v").innerHTML=h}).catch(err)}
function rform(id){var x=RW.filter(function(r){return r.id===id})[0]||{nivel:2,activo:true,orden:0};
 $("#v").innerHTML='<div class="row"><button class="btn s" onclick="go(\'rec\')">← Volver</button></div><form id="rwf"><fieldset><legend>'+(id?"Editar":"Nueva")+' recompensa</legend><div class="g"><label>Se desbloquea en<select name="nivel">'+PREMIOS.niveles.map(function(n,i){return '<option value="'+(i+1)+'"'+(x.nivel===i+1?" selected":"")+'>'+esc(nivNom(i+1))+' ('+n[0]+' pts)</option>'}).join("")+'</select></label><label>Orden<input type="number" name="orden" value="'+esc(x.orden)+'"></label><label class="full">Título<input name="titulo" required maxlength="160" value="'+esc(x.titulo)+'" placeholder="Ej. 20% en tu próxima clase"></label><label class="full">Descripción<textarea name="descripcion" maxlength="1000">'+esc(x.descripcion)+'</textarea></label><label>Sponsor (opcional)<input name="sponsor" value="'+esc(x.sponsor)+'"></label><label>Código o instrucciones<input name="codigo" value="'+esc(x.codigo)+'" placeholder="Ej. NIVEL3RR"></label><label class="full">Enlace (opcional)<input name="enlace" placeholder="https://" value="'+esc(x.enlace)+'"></label><label><input type="checkbox" name="activo" style="display:inline;width:auto"'+(x.activo?" checked":"")+'> Activa</label></div>'
 +'<div class="row"><button class="btn" type="submit">Guardar</button>'+(id?'<button class="btn s" type="button" id="delr" onclick="delR(\''+id+'\')">'+ic("basura",16)+'Eliminar</button>':"")+'<span class="msg" id="rm2"></span></div></fieldset></form>';
 $("#rwf").onsubmit=function(e){e.preventDefault();var o=read(e.target),b={nivel:+o.nivel,titulo:o.titulo,descripcion:o.descripcion,sponsor:o.sponsor,codigo:o.codigo,enlace:o.enlace.trim(),activo:!!o.activo,orden:parseInt(o.orden,10)||0};
  api(id?"PUT":"POST","/api/admin/recompensas"+(id?"/"+id:""),b).then(function(){go("rec")}).catch(function(x){$("#rm2").textContent=x.message+(x.details?" "+x.details.join(" "):"")})}}
function delR(id){var b=$("#delr");if(pend!==id){pend=id;b.textContent="¿Seguro? Toca de nuevo";return}pend=null;api("DELETE","/api/admin/recompensas/"+id).then(function(){go("rec")}).catch(err)}

/* PUBLICIDAD */
var LUG=[["INICIO","Inicio"],["SESIONES","Sesiones"],["DATOS","Mis Métricas"]];
function vig(a){var d=new Date().toISOString().slice(0,10),de=fd(a.desde),ha=fd(a.hasta);if(!a.activo)return '<span class="tag PENDIENTE">Pausado</span>';if(a.desde&&de>d)return '<span class="tag PENDIENTE">Programado</span>';if(a.hasta&&ha<d)return '<span class="tag RECHAZADO">Vencido</span>';return '<span class="tag APROBADO">Activo</span>'}
function anuncios(){api("GET","/api/admin/anuncios").then(function(r){A=r.items;tabs();
 var h='<div class="row"><h2 class="ttl" style="margin:0 auto 0 0">'+ic("anuncio",22)+'Anuncios de sponsors</h2><button class="btn" onclick="aform()">'+ic("mas",16)+'Nuevo anuncio</button></div><p class="mu">Se muestran a los pilotos con plan Gratis y Plus, y a los Pro que activen los anuncios. Cuando varios compiten por el mismo espacio, se sortean según su peso.</p>';
 h+=A.length?'<div class="tw"><table><thead><tr><th>Banner</th><th>Anuncio</th><th>Lugares</th><th>Deportes</th><th>Vigencia</th><th>Estado</th><th>Impresiones</th><th>Clics</th><th>CTR</th></tr></thead><tbody>'+A.map(function(a){return '<tr class="ck" onclick="aform(\''+a.id+'\')"><td>'+(a.imagen?'<img class="bn" src="'+esc(a.imagen)+'" alt="">':'<span class="mu">Solo texto</span>')+'</td><td><b>'+esc(a.titulo)+'</b><div class="mu">'+esc(a.sponsor)+'</div></td><td>'+a.lugares.map(function(l){return LUG.filter(function(x){return x[0]===l})[0][1]}).join(", ")+'</td><td>'+(a.deportes.length?deps(a.deportes):'<span class="mu">Todos</span>')+'</td><td>'+(a.desde?fd(a.desde):"—")+' → '+(a.hasta?fd(a.hasta):"—")+'</td><td>'+vig(a)+'</td><td>'+a.impresiones+'</td><td>'+a.clics+'</td><td>'+(a.impresiones?(a.clics*100/a.impresiones).toFixed(1)+"%":"—")+'</td></tr>'}).join("")+'</tbody></table></div>':'<p class="mu">Aún no hay anuncios.</p>';
 $("#v").innerHTML=h}).catch(err)}
var AIMG="";
function aform(id){var a=A.filter(function(x){return x.id===id})[0]||{lugares:["INICIO"],deportes:[],activo:true,peso:1};AIMG=a.imagen||"";
 $("#v").innerHTML='<div class="row"><button class="btn s" onclick="go(\'ads\')">← Volver</button></div><form id="af"><fieldset><legend>'+(id?"Editar":"Nuevo")+' anuncio</legend><div class="g"><label>Sponsor<input name="sponsor" required value="'+esc(a.sponsor)+'"></label><label>Título<input name="titulo" required maxlength="160" value="'+esc(a.titulo)+'"></label><label class="full">Texto (opcional, hasta 400 caracteres)<input name="texto" maxlength="400" value="'+esc(a.texto)+'"></label><label class="full">Enlace al hacer clic<input name="enlace" placeholder="https://" value="'+esc(a.enlace)+'"></label></div>'
 +'<label>Banner (se recorta a 3:1, 1200 × 400 px)</label><div class="row"><img id="aprev" class="bn" style="width:300px;'+(AIMG?"":"display:none")+'" src="'+esc(AIMG)+'" alt=""><label class="btn s" style="margin:0">'+ic("imagen",16)+'Subir imagen<input type="file" accept="image/*" style="display:none" onchange="banner(this)"></label><button type="button" class="btn s" onclick="AIMG=\'\';$(\'#aprev\').style.display=\'none\'">Quitar imagen</button></div>'
 +'<label>Dónde se muestra</label><div class="chk">'+LUG.map(function(l){return '<label><input type="checkbox" data-l="'+l[0]+'"'+(a.lugares.indexOf(l[0])>=0?" checked":"")+'>'+l[1]+'</label>'}).join("")+'</div>'
 +'<label>Deportes (ninguno marcado = todos)</label><div class="chk">'+DEPORTES.map(function(d){return '<label><input type="checkbox" data-d="'+d[0]+'"'+(a.deportes.indexOf(d[0])>=0?" checked":"")+'>'+ic(d[2],16)+esc(d[1])+'</label>'}).join("")+'</div>'
 +'<div class="g"><label>Desde (opcional)<input type="date" name="desde" value="'+esc(a.desde?fd(a.desde):"")+'"></label><label>Hasta (opcional)<input type="date" name="hasta" value="'+esc(a.hasta?fd(a.hasta):"")+'"></label><label>Peso (1 a 100)<input type="number" name="peso" min="1" max="100" value="'+esc(a.peso)+'"></label><label><input type="checkbox" name="activo" style="display:inline;width:auto"'+(a.activo?" checked":"")+'> Activo</label></div>'
 +'<div class="row"><button class="btn" type="submit">Guardar</button>'+(id?'<button type="button" class="btn s" onclick="reiniciar(\''+id+'\')">Reiniciar métricas</button><button class="btn s" type="button" id="dela" onclick="delA(\''+id+'\')">'+ic("basura",16)+'Eliminar</button>':"")+'<span class="msg" id="am"></span></div></fieldset></form>';
 $("#af").onsubmit=function(e){e.preventDefault();var o=read(e.target),f=e.target,b={sponsor:o.sponsor,titulo:o.titulo,texto:o.texto,enlace:o.enlace.trim(),imagen:AIMG,lugares:[].map.call(f.querySelectorAll("[data-l]:checked"),function(i){return i.dataset.l}),deportes:[].map.call(f.querySelectorAll("[data-d]:checked"),function(i){return i.dataset.d}),desde:o.desde||null,hasta:o.hasta||null,peso:parseInt(o.peso,10)||1,activo:!!o.activo};
  api(id?"PUT":"POST","/api/admin/anuncios"+(id?"/"+id:""),b).then(function(){go("ads")}).catch(function(x){$("#am").textContent=x.message+(x.details?" "+x.details.join(" "):"")})}}
// Banner: recorte centrado a 3:1 y JPEG al 80 % (suele quedar bajo 150 KB).
function banner(inp){var f=inp.files&&inp.files[0];inp.value="";if(!f)return;var r=new FileReader();r.onload=function(){var i=new Image();i.onload=function(){var W=1200,H=400,c=document.createElement("canvas");c.width=W;c.height=H;var k=Math.max(W/i.width,H/i.height),w=i.width*k,h=i.height*k;var x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,W,H);x.drawImage(i,(W-w)/2,(H-h)/2,w,h);AIMG=c.toDataURL("image/jpeg",.8);var p=$("#aprev");p.src=AIMG;p.style.display=""};i.src=r.result};r.readAsDataURL(f)}
function reiniciar(id){api("POST","/api/admin/anuncios/"+id+"/reiniciar").then(function(){anuncios()}).catch(err)}
function delA(id){var b=$("#dela");if(pend!==id){pend=id;b.textContent="¿Seguro? Toca de nuevo";return}pend=null;api("DELETE","/api/admin/anuncios/"+id).then(function(){go("ads")}).catch(err)}

boot();
</script>
</body>
</html>
